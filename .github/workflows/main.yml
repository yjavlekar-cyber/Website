name: New website
on:
  push:
    branches: [main]
jobs:

  built and push: 
    runs-on: ubuntu

  steps:
    - name: Code checkout
      uses: actions/checkout@v4
    - name: build and push
      run: |
       docker build -t website ./frontend
       docker build -t my-website ./backend
    - name: Deploy
      run: docker compose up -d --build --force --recreate
