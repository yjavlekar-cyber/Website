name: New website
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Build Images
        run: |
          docker build -t website ./frontend
          docker build -t my-website ./backend
      
      - name: Run Containers
        run: docker compose up -d --build
